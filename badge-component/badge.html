<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Badge</title>
        <link rel="stylesheet" href="badge.css" />
    </head>
    <body>
        <header class="header">
            <h1 class="title">Sixth Sense</h1>
            <p class="title-description">AI Powered Marketing Intelligence</p>
        </header>
        <main>
            <section class="main-content--container">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-content--name">Market Interest</h3>
                        <span class="c-badge c-badge--positive">+18.5%</span>
                    </div>
                    <p class="card-content--data">78.6%</p>
                    <p class="card-content--description">High Momentum</p>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-content--name">Competitor Share</h3>
                        <span class="c-badge c-badge--neutral">Stable</span>
                    </div>
                    <p class="card-content--data">22.4%</p>
                    <p class="card-content--description">Ranked #3 of 6</p>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-content--name">Click Conversions</h3>
                        <span class="c-badge c-badge--negative">-2.4%</span>
                    </div>
                    <p class="card-content--data">5.7%</p>
                    <p class="card-content--description">Cooling off</p>
                </div>

                <div class="card">
                    <span class="c-badge">primary</span>
                </div>
            </section>
        </main>
    </body>
</html>
