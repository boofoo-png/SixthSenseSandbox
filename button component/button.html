<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Components</title>
    <link href="button.css" rel="stylesheet"/>
</head>
<body class="body">
    <h1 class="heading">Here are our Buttons</h1>
        <div class="button-main">
            <section class="button-content">
                <button class="button">Primary Button</button>
                <button class="button button--secondary">Secondary Button</button>
                <button class="button button--attach-file">Attach File Button</button>
                <button class="button button--cancel">Cancel Button</button>
                <button class="button button--log-in">Log In</button>
            </section>
        </div>
</body>
</html>
